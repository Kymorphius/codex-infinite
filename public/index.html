<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>控制台 · Codex</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/tasks.css">
    <link rel="stylesheet" href="/styles/sessions-priority.css">
    <link rel="stylesheet" href="/styles/approvals.css">
    <link rel="stylesheet" href="/styles/execution.css">
    <link rel="stylesheet" href="/styles/conversation.css">
    <link rel="stylesheet" href="/styles/states.css">
    <link rel="stylesheet" href="/styles/zotero.css">
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/responsive.css">
  </head>
  <body>
    <div class="app-shell" data-testid="control-console">
      <header class="topbar">
        <div>
          <p class="eyebrow">CODEX CONTROL CONSOLE</p>
          <h1 data-testid="module-title">看板</h1>
        </div>
        <div class="topbar-actions">
          <span class="loopback-pill"><span class="status-dot"></span>仅本机</span>
          <button class="quiet-button" type="button" data-action="refresh">刷新</button>
          <button class="quiet-button" type="button" data-action="close">返回对话</button>
        </div>
      </header>

      <nav class="module-nav" aria-label="控制台模块">
        <div class="module-nav-inner">
          <button class="module-tab is-active" type="button" data-module-target="board" data-action="module" aria-current="page">看板</button>
          <button class="module-tab" type="button" data-module-target="console" data-action="module">控制台</button>
          <button class="module-tab" type="button" data-module-target="sessions" data-action="module">会话中心</button>
          <button class="module-tab" type="button" data-module-target="context" data-action="module">上下文状态</button>
          <button class="module-tab" type="button" data-module-target="priority" data-action="module">项目优先级</button>
          <button class="module-tab" type="button" data-module-target="zotero" data-action="module">文献库</button>
          <span class="module-caption" data-testid="module-caption">只读项目任务视图</span>
        </div>
      </nav>

      <main class="content">
        <!-- MODULE_PANELS -->
      </main>
      <div class="toast hidden" data-testid="toast" role="status"></div>
    </div>
<script src="/app.js" type="module"></script></body></html>
