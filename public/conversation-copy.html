<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script src="/theme.js"></script><title>复制会话以继续工作 · Codex</title><link rel="stylesheet" href="/styles/project-sync.css"><link rel="stylesheet" href="/styles/conversation-copy.css"></head>
<body><main class="workspace"><header class="page-header"><div><h1>复制会话以继续工作</h1><p>将已结束会话的历史复制到另一台设备的项目中。</p><a href="/project-sync.html">返回项目同步</a></div></header>
<section class="selection conversation-selection"><article class="project-choice"><h2>从哪里继续</h2><label for="conversation-source">源设备与项目</label><select id="conversation-source"><option value="">正在读取…</option></select><label for="conversation-thread">已结束的会话</label><select id="conversation-thread"><option value="">先选择源项目…</option></select><p id="conversation-list-note" class="choice-note"></p></article>
<article class="project-choice"><h2>目标项目</h2><label for="conversation-target">设备与项目副本</label><select id="conversation-target"><option value="">先选择源项目…</option></select><p class="choice-note">只列出另一台在线设备上已关联的同一项目。两个副本的分支和代码版本须一致。</p><label for="conversation-note">交接说明（可选，最多 2000 字）</label><textarea id="conversation-note" maxlength="2000" rows="4" placeholder="例如当前进度、下一步要检查的内容"></textarea><label for="conversation-operations">此目标保留的待核对副本</label><select id="conversation-operations"><option value="">选择目标项目后读取…</option></select></article></section>
<p class="notice">确认后复制会话历史，目标会生成独立的会话 ID，源会话保留。交接说明保存为私有操作记录；不会自动发送消息或启动任务。</p>
<p id="conversation-status" role="status"></p><p id="conversation-error" class="notice error" role="alert"></p><pre id="conversation-preview" hidden></pre>
<div class="actions"><button class="button" id="conversation-refresh">刷新设备</button><button class="button primary" id="conversation-check">检查复制条件</button><button class="button primary" id="conversation-copy" hidden>确认复制历史</button><button class="button" id="conversation-resume" hidden>核对并完成已有操作</button></div>
<p id="conversation-recovery" class="choice-note" hidden></p><p class="choice-note">首次仅支持可独立复制的已结束主会话。运行中会话、子任务或依赖其他会话的记录会显示原因。</p></main><script type="module" src="/features/project-sync/conversation-copy.js"></script></body></html>
