        <section data-module-panel="board">
          <section class="dispatch-overview" aria-labelledby="dispatch-board-title">
            <div class="dispatch-overview-copy">
              <p class="eyebrow">DISPATCH BOARD</p>
              <h2 id="dispatch-board-title">任务看板</h2>
              <p class="muted">安排任务并续接指定 Codex 对话。单并发，按入队时间执行。</p>
            </div>
            <div class="dispatch-metrics" aria-label="看板概览">
              <span><strong data-testid="dispatch-count">—</strong> 全部</span>
              <span><strong data-testid="dispatch-waiting-count">—</strong> 等待</span>
              <span><strong data-testid="dispatch-target-count">—</strong> 对话</span>
            </div>
            <button class="primary-button dispatch-create-toggle" type="button" data-action="toggle-dispatch-composer" aria-expanded="false" aria-controls="dispatch-composer">新建任务</button>
          </section>

          <section class="composer-card hidden" id="dispatch-composer" data-testid="dispatch-composer">
            <div class="section-heading">
              <div><p class="eyebrow">NEW TASK</p><h2>安排一个任务</h2></div>
              <div class="dispatch-composer-actions"><span class="section-status" data-testid="connection-status">连接中…</span><button class="quiet-button" type="button" data-action="toggle-dispatch-composer" aria-expanded="true" aria-controls="dispatch-composer">收起</button></div>
            </div>
            <form data-testid="dispatch-form" class="dispatch-form">
              <label class="field field-wide"><span>任务标题</span><input name="title" maxlength="160" required placeholder="例如：检查发布流程并给出修复"></label>
              <label class="field"><span>项目</span><select name="project" data-testid="dispatch-project" required><option value="">选择项目</option></select></label>
              <label class="field"><span>目标对话</span><select name="targetThreadId" data-testid="dispatch-thread" disabled><option value="">先选择项目</option></select></label>
              <label class="field"><span>发送时间</span><input name="scheduledAt" type="datetime-local"></label>
              <label class="field"><span>初始状态</span><select name="mode"><option value="queue">立即排队</option><option value="schedule">按时间发送</option><option value="backlog">先放入待排期</option></select></label>
              <label class="field field-full"><span>发送给 Codex 的任务说明</span><textarea name="prompt" maxlength="12000" rows="4" required placeholder="写清目标、范围、验收条件和限制。"></textarea></label>
              <div class="form-footer"><span>只会发送到你选择的项目对话；发送后由该对话继续执行。</span><button class="primary-button" type="submit">加入任务看板</button></div>
            </form>
          </section>

          <section class="board-section">
            <div class="section-heading">
              <div><p class="eyebrow">TASK PIPELINE</p><h2>发送队列</h2></div>
              <button class="quiet-button" type="button" data-action="refresh-dispatches">刷新</button>
            </div>
            <div class="dispatch-toolbar" aria-label="筛选任务">
              <label class="dispatch-search"><span class="sr-only">搜索任务</span><input type="search" data-testid="dispatch-search" placeholder="搜索标题、说明、项目或对话"></label>
              <label class="dispatch-project-filter"><span class="sr-only">筛选项目</span><select data-testid="dispatch-filter-project"><option value="">全部项目</option></select></label>
              <button class="quiet-button hidden" type="button" data-testid="dispatch-clear-filter">清除筛选</button>
              <span class="dispatch-result-count" data-testid="dispatch-result-count" aria-live="polite">—</span>
            </div>
            <div class="state-card" data-dispatch-state="loading"><div class="spinner" aria-hidden="true"></div><h3>正在读取发送队列</h3><p>队列保存在本机控制台目录。</p></div>
            <div class="state-card hidden" data-dispatch-state="error"><div class="state-icon">!</div><h3>发送队列暂时不可用</h3><p data-dispatch-state-message>请稍后重试。</p></div>
            <div class="dispatch-board hidden" data-testid="dispatch-board" aria-live="polite">
              <section class="board-column" data-dispatch-column="backlog"><header class="board-column-header"><h3>待排期</h3><span class="column-count" data-dispatch-count="backlog">0</span></header><div class="board-column-list" data-dispatch-list="backlog"></div></section>
              <section class="board-column" data-dispatch-column="scheduled"><header class="board-column-header"><h3>已排期</h3><span class="column-count" data-dispatch-count="scheduled">0</span></header><div class="board-column-list" data-dispatch-list="scheduled"></div></section>
              <section class="board-column" data-dispatch-column="queued"><header class="board-column-header"><h3>排队中</h3><span class="column-count" data-dispatch-count="queued">0</span></header><div class="board-column-list" data-dispatch-list="queued"></div></section>
              <section class="board-column" data-dispatch-column="sending"><header class="board-column-header"><h3>发送中</h3><span class="column-count" data-dispatch-count="sending">0</span></header><div class="board-column-list" data-dispatch-list="sending"></div></section>
            </div>
            <section class="dispatch-results hidden" data-testid="dispatch-results" aria-labelledby="dispatch-results-title">
              <div class="dispatch-results-heading"><div><p class="eyebrow">RESULTS</p><h3 id="dispatch-results-title">执行结果</h3></div><span data-testid="dispatch-results-summary">0 条记录</span></div>
              <div class="dispatch-results-grid">
                <section class="board-column" data-dispatch-column="sent"><header class="board-column-header"><h3>已发送</h3><span class="column-count" data-dispatch-count="sent">0</span></header><div class="board-column-list" data-dispatch-list="sent"></div></section>
                <section class="board-column" data-dispatch-column="failed"><header class="board-column-header"><h3>异常与取消</h3><span class="column-count" data-dispatch-count="failed">0</span></header><div class="board-column-list" data-dispatch-list="failed"></div></section>
              </div>
            </section>
          </section>
          <div class="dispatch-detail-layer hidden" data-testid="dispatch-detail-layer">
            <button class="dispatch-detail-backdrop" type="button" data-dispatch-detail-close aria-label="关闭任务详情"></button>
            <aside class="dispatch-detail-panel" role="dialog" aria-modal="true" aria-labelledby="dispatch-detail-title">
              <header class="dispatch-detail-header">
                <div><p class="eyebrow">TASK DETAILS</p><h2 id="dispatch-detail-title">任务详情</h2></div>
                <button class="quiet-button" type="button" data-dispatch-detail-close aria-label="关闭任务详情">关闭</button>
              </header>
              <form class="dispatch-detail-form" data-testid="dispatch-detail-form">
                <p class="dispatch-detail-notice" data-testid="dispatch-detail-notice"></p>
                <label class="field"><span>任务标题</span><input name="title" maxlength="160" required></label>
                <div class="dispatch-detail-route-fields">
                  <label class="field"><span>项目</span><select name="project" required></select></label>
                  <label class="field"><span>目标对话</span><select name="targetThreadId" required></select></label>
                </div>
                <label class="field"><span>发送时间</span><input name="scheduledAt" type="datetime-local"></label>
                <label class="field"><span>任务说明</span><textarea name="prompt" maxlength="12000" rows="8" required></textarea></label>
                <dl class="dispatch-detail-meta" data-testid="dispatch-detail-meta"></dl>
                <div class="dispatch-error hidden" data-testid="dispatch-detail-error"></div>
                <footer class="dispatch-detail-footer"><button class="quiet-button" type="button" data-dispatch-detail-close>取消</button><button class="primary-button" type="submit" data-testid="dispatch-detail-save">保存修改</button></footer>
              </form>
            </aside>
          </div>
        </section>
